<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="color-scheme" content="light dark"><title>FINVIS Mobile</title><link rel="icon" href="data:,"><link rel="stylesheet" href="/app.css"><link rel="stylesheet" href="/experience.css"><script type="module" src="/shared.js"></script><script type="module" src="/mobile.js"></script><link rel="stylesheet" href="/future_experience.css"><link rel="stylesheet" href="/theme.css"><link rel="stylesheet" href="/simple_surface.css"></head>
<body class="mobile-app">
<div id="finvis-boot-status" class="finvis-boot-status" role="status" aria-live="polite"><div><strong>FINVIS 正在启动 / Starting FINVIS…</strong></div></div><a class="skip" href="#mobile-main" data-i18n="a11y.skip"></a>
<header class="mobile-head"><div><span class="mobile-brand">FINVIS</span><small data-i18n="mobile.companion"></small></div><div class="mobile-head-actions"><button id="local-ai-trigger" class="local-ai-trigger compact" type="button" data-state="checking"><span class="local-ai-dot" aria-hidden="true"></span><span id="local-ai-trigger-text" data-i18n="localAI.state.checking"></span></button><div id="language-switch" class="language-switch compact" role="group" data-i18n-aria="language.label"><button type="button" data-language="en" aria-pressed="true">EN</button><span aria-hidden="true">/</span><button type="button" data-language="zh-CN" aria-pressed="false">中文</button></div></div></header>
<main id="mobile-main"><div id="feedback" class="feedback" role="status" aria-live="polite" tabindex="-1" hidden></div><div id="connection" class="feedback error" role="alert" hidden><span id="connection-text"></span><button id="refresh" class="inline-button" type="button" data-i18n="connection.refresh"></button></div>
<section id="mobile-home" class="mobile-view active" data-view="home"><div class="mobile-intro"><p data-i18n="home.greeting"></p><h1 data-i18n="mobile.worldHeading"></h1></div><form id="finvis-command" class="agent-command mobile-command" novalidate><label for="finvis-input"><span class="agent-mark" aria-hidden="true">✦</span><strong data-i18n="agent.label"></strong></label><div class="command-row"><textarea id="finvis-input" rows="1" autocomplete="off" data-i18n-placeholder="agent.placeholder" data-i18n-aria="agent.inputLabel"></textarea><button id="agent-submit" type="submit" data-i18n="agent.submit"></button></div><div class="composer-meta"><p class="composer-hint" data-i18n="agent.keyboardHint"></p><div class="draft-status-row"><span id="agent-draft-status" class="draft-status" role="status" aria-live="polite" aria-atomic="true" hidden></span><button id="agent-draft-clear" class="draft-clear" type="button" data-i18n="agent.clearDraft"></button></div></div><p id="agent-processing" class="agent-processing" role="status" aria-live="polite" hidden></p><div class="command-chips" data-i18n-aria="agent.examples"><button type="button" data-agent-example="trip" data-i18n="agent.example.trip"></button><button type="button" data-agent-example="offer" data-i18n="agent.example.offer"></button><button type="button" data-agent-example="if3" data-i18n="agent.example.if"></button></div></form><section class="mobile-state-block"><div class="section-title"><h2 data-i18n="state.section"></h2><button id="mobile-open-state" class="text-action" type="button" data-i18n="state.manage"></button></div><div class="mobile-state"><article><strong id="liquidity">—</strong><span data-i18n="metric.liquidity"></span></article><article><strong><span id="current-runway">—</span> <small data-i18n="unit.months"></small></strong><span data-i18n="metric.runway"></span></article></div><p id="employment"></p></section><section class="mobile-progress"><div class="section-title"><h2 data-i18n="progress.title"></h2><b id="decision-count" class="sr-only"></b></div><div id="active-decisions" class="decision-collection mobile-collection"></div><button id="mobile-open-goals" class="goal-progress" type="button"><span data-i18n="goals.type"></span><strong id="home-goal-title">—</strong><small id="home-goal-date"></small><b data-i18n="goal.open"></b></button></section><section class="mobile-observation"><span class="attention-signal" data-i18n="attention.label"></span><b>FINVIS</b><h2 data-i18n="observation.count"></h2><p id="observation-copy"></p><button id="observation-action" class="text-action" type="button"></button></section></section>
<section id="mobile-state-detail" class="mobile-view" data-view="state" hidden><button class="mobile-back" data-go="home" type="button">← <span data-i18n="nav.home"></span></button><p class="kicker" data-i18n="state.managerEyebrow"></p><h1 data-i18n="state.detailTitle"></h1><p data-i18n="state.managerIntro"></p><div class="state-groups"><article><div><span data-i18n="state.category.liquidity"></span><strong id="state-detail-liquidity">—</strong><small data-i18n="state.readonly"></small></div><button type="button" disabled data-i18n="state.edit"></button></article><article><div><span data-i18n="state.category.essentials"></span><strong id="state-detail-essentials">—</strong><small data-i18n="state.readonly"></small></div><button type="button" disabled data-i18n="state.edit"></button></article><article><div><span data-i18n="state.category.employment"></span><strong id="state-detail-employment">—</strong><small id="employment-note"></small></div><button id="state-open-employment" type="button" data-i18n="state.updateEmployment"></button></article><article><div><span data-i18n="state.category.goals"></span><strong id="state-manager-goal">—</strong><small data-i18n="state.goalManaged"></small></div><button id="state-open-goal-flow" type="button" data-i18n="state.editGoal"></button></article></div><div class="unsupported-operations"><span data-i18n="state.add"></span><span data-i18n="state.delete"></span><p data-i18n="state.crudBoundary"></p></div></section>
<section id="mobile-goals" class="mobile-view" data-view="goals" hidden><button class="mobile-back" data-go="home" type="button">← <span data-i18n="nav.home"></span></button><h1 data-i18n="goals.title"></h1><div id="goals-list" class="goals-list detailed-goals"></div></section>
<section id="mobile-decision" class="mobile-view" data-view="decision" hidden><button class="mobile-back" data-go="home" type="button">← <span data-i18n="nav.home"></span></button><p class="kicker" data-i18n="workspace.eyebrow"></p><h1 data-i18n="decision.title"></h1><p id="story-copy"></p><div class="mobile-impact"><span data-i18n="decision.runwayImpact"></span><strong><span id="detail-before">—</span> → <span id="detail-after">—</span></strong><small data-i18n="decision.noVerdict"></small></div><p id="delta" class="callout"></p><button class="secondary-button wide" data-go="future" type="button" data-i18n="decision.compare"></button><section class="mobile-action-block"><p class="kicker" data-i18n="proposal.eyebrow"></p><h2 data-i18n="proposal.title"></h2><ul id="proposal-changes"></ul><button id="prepare" type="button" disabled></button><button id="authorize" type="button" disabled hidden data-i18n="proposal.authorize"></button><p id="consent-note" class="note"></p></section></section>
<section id="mobile-future" class="mobile-view" data-view="future" hidden><p class="kicker" data-i18n="futures.eyebrow"></p><h1 data-i18n="futures.title"></h1><p id="future-context"></p><form id="contextual-if" class="if-command" novalidate><label for="if-input" data-i18n="if.prompt"></label><div><input id="if-input" type="text" autocomplete="off" data-i18n-placeholder="if.placeholder"><button type="submit" data-i18n="if.inspect"></button></div><div class="if-quick-options"><button type="button" data-if-months="1" data-i18n="if.one"></button><button type="button" data-if-months="3" data-i18n="if.three"></button><button type="button" data-if-months="6" data-i18n="if.six"></button><button type="button" data-if-custom data-i18n="if.custom"></button></div><p id="if-feedback" role="status" aria-live="polite"></p></form><div class="if-space mobile-if"><div class="reality-origin"><span data-i18n="futures.currentReality"></span><strong id="reality-origin"></strong></div><div id="if-lines" class="if-lines"></div></div><span id="line-count" class="status-pill"></span><details><summary data-i18n="futures.assumptions"></summary><p data-i18n="futures.assumptionCopy"></p><p class="note" data-i18n="futures.deficit"></p></details></section>
<section id="mobile-plan" class="mobile-view" data-view="plan" hidden><p class="kicker" data-i18n="plan.eyebrow"></p><h1 data-i18n="plan.title"></h1><div class="plan-detail-summary"><strong id="plan-version">—</strong><span id="plan-state"></span></div><p id="plan-overview-copy"></p><ol id="plan-history" class="timeline"></ol><p id="allocation-note" class="note"></p><section class="mobile-reality"><p class="kicker" data-i18n="reality.eyebrow"></p><h2 id="offer-title"></h2><p><span data-i18n="reality.offer"></span> · <strong id="offer-salary">—</strong> <span data-i18n="unit.perMonth"></span></p><button id="employment-action" type="button" disabled></button><p id="event-help" class="note"></p><div id="reality-result" hidden><h3 data-i18n="reality.resolved"></h3><p id="resolution"></p><p><span data-i18n="reality.cashflow"></span> <strong data-i18n="reality.notCalculated"></strong></p><ul id="pending"></ul><p id="reevaluated-metrics"></p></div></section></section>
<section id="mobile-activity" class="mobile-view" data-view="activity" hidden><p class="kicker" data-i18n="activity.eyebrow"></p><h1 data-i18n="activity.title"></h1><ul id="receipt-summary" class="evidence-list"></ul><p id="activity-empty"></p><details><summary data-i18n="evidence.reasoning"></summary><dl id="audit-summary"></dl></details><button id="reset-open" class="secondary-button wide" type="button" data-i18n="reset.button"></button></section></main>
<nav class="bottom-nav" data-i18n-aria="nav.mobile"><button class="active" data-go="home"><span>⌂</span><b data-i18n="nav.home"></b></button><button data-go="decision"><span>◇</span><b data-i18n="nav.decision"></b></button><button data-go="plan"><span>◎</span><b data-i18n="nav.planShort"></b></button><button data-go="future"><span>⌁</span><b data-i18n="nav.future"></b></button><button data-go="activity"><span>↗</span><b data-i18n="nav.activity"></b></button></nav>
<dialog id="agent-preview" class="agent-preview-dialog" aria-labelledby="agent-preview-title"><header><div><p class="kicker" data-i18n="agent.previewEyebrow"></p><h2 id="agent-preview-title" tabindex="-1" data-i18n="agent.previewTitle"></h2><p id="agent-preview-action"></p></div></header><section class="agent-candidate-summary"><h3 data-i18n="agent.summaryHeading"></h3><p id="agent-understood-summary"></p><div class="agent-stage-status" aria-live="polite"><strong id="agent-stage-understanding"></strong><span id="agent-stage-world"></span><small id="agent-stage-next"></small></div><div id="agent-attention-section" class="agent-attention"><strong data-i18n="agent.attentionHeading"></strong><ul id="agent-attention"></ul></div><p id="agent-unresolved-summary"></p><p class="agent-next" data-i18n="agent.nextStep"></p></section><section id="agent-questions-section"><h3 data-i18n="agent.questions"></h3><ul id="agent-questions"></ul></section><details id="agent-details" class="agent-details"><summary id="agent-details-toggle"></summary><div id="agent-facts" class="agent-facts"></div></details><p id="agent-preview-boundary" class="callout"></p><p class="note" data-i18n="agent.noCalculation"></p><div class="agent-preview-actions"><button id="agent-cancel" class="secondary-button" type="button" data-i18n="agent.cancel"></button><button id="agent-confirm" type="button" data-i18n="agent.confirm"></button></div></dialog>
<dialog id="local-ai-dialog" class="detail-dialog local-ai-dialog" aria-labelledby="local-ai-title"><header class="local-ai-header"><div><span data-i18n="localAI.eyebrow"></span><h2 id="local-ai-title" data-i18n="localAI.title"></h2></div><button id="local-ai-close" class="icon-button" type="button" data-i18n-aria="localAI.close">×</button></header><div class="local-ai-scroll"><p class="manager-intro" data-i18n="localAI.intro"></p><dl class="local-ai-summary"><dt data-i18n="localAI.provider"></dt><dd id="local-ai-provider">—</dd><dt data-i18n="localAI.connection"></dt><dd id="local-ai-connection">—</dd><dt data-i18n="localAI.endpoint"></dt><dd id="local-ai-endpoint">—</dd><dt data-i18n="localAI.selectedModel"></dt><dd id="local-ai-selected">—</dd><dt data-i18n="localAI.status"></dt><dd id="local-ai-status">—</dd></dl><section class="local-ai-model-section"><div><h3 data-i18n="localAI.models"></h3><button id="local-ai-refresh" class="secondary-button" type="button" data-i18n="localAI.refresh"></button></div><p id="local-ai-empty" data-i18n="localAI.noModels"></p><div id="local-ai-models" class="local-ai-models"></div></section><details class="local-ai-diagnostics"><summary data-i18n="localAI.diagnostics"></summary><p id="local-ai-diagnostics"></p></details><p class="local-ai-boundary" data-i18n="localAI.boundary"></p></div></dialog>
<dialog id="reset-dialog" class="confirm-dialog" aria-labelledby="reset-title"><h2 id="reset-title" data-i18n="reset.title"></h2><p data-i18n="reset.copy"></p><div><button id="reset-cancel" class="secondary-button" type="button" data-i18n="reset.cancel"></button><button id="reset-confirm" type="button" data-i18n="reset.confirm"></button></div></dialog></body></html>
